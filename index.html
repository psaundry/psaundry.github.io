<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Underwood Stakes Day · Might and Power Club</title>
  <meta name="theme-color" content="#1E3D2F" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<script>
(async function () {
  const src = 'https://raw.githubusercontent.com/psaundry/psaundry.github.io/86b374f0cd3b96b2c6fc6116d47164dbe2bd9c12/index.html';
  const res = await fetch(src);
  let html = await res.text();
  const oldMatt = `<article class="matt">\n        <h3>Matt Hyland</h3>\n        <p>Matt was with us representing the jockeys association \u2014 son of legend Pat Hyland. The sort of presence that makes a race day feel like a race day.</p>\n      </article>`;
  const newMatt = `<article>\n          <img src="https://www.justhorseracing.com.au/wp-content/uploads/2019/07/Matt-Hyland-734x460.png" alt="Matt Hyland, Chief Executive of the Victorian Jockeys Association" width="734" height="460" loading="lazy" />\n          <h3>Matt Hyland</h3>\n          <p>Matt was with us representing the Victorian Jockeys Association \u2014 son of legend Pat Hyland. The sort of presence that makes a race day feel like a race day.</p>\n        </article>`;
  const willClose = `</p>\n        </article>\n      </div>\n      `;
  const troy = `</p>\n        </article>\n        <article>\n          <img src="https://cdn.prism.horse/media/9b20dc84e10a4f8baca387c8f4478e85.png" alt="Troy Corstens, Head Trainer at Malua Racing" width="754" height="1024" loading="lazy" />\n          <h3>Troy Corstens</h3>\n          <p>Head trainer at <a href="https://www.maluaracing.com.au/our-people">Malua Racing</a> with Leon Corstens and Will Larkin. Troy couldn\u2019t make the room \u2014 Will came up to speak \u2014 but Harry rode Bohemian Boy for the team in race 2.</p>\n        </article>\n      </div>\n      `;
  html = html.replace(oldMatt, newMatt);
  if (html.indexOf('will.jpg') !== -1) {
    html = html.replace(willClose, troy);
  }
  document.open();
  document.write(html);
  document.close();
})().catch(function () {
  document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem">Could not load the recap.</p>';
});
</script>
</body>
</html>
