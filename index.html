<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Underwood Stakes Day · Might and Power Club</title>
  <meta name="theme-color" content="#1E3D2F" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<script>
(async function () {
  const src = 'https://raw.githubusercontent.com/psaundry/psaundry.github.io/86b374f0cd3b96b2c6fc6116d47164dbe2bd9c12/index.html';
  const res = await fetch(src);
  let html = await res.text();
  html = html.replace(
    '<article class="matt">',
    '<article>'
  );
  html = html.replace(
    'Matt was with us representing the jockeys association',
    'Matt was with us representing the Victorian Jockeys Association'
  );
  if (html.indexOf('Matt Hyland') !== -1 && html.indexOf('justhorseracing') === -1) {
    html = html.replace(
      '<h3>Matt Hyland</h3>',
      '<img src="https://www.justhorseracing.com.au/wp-content/uploads/2019/07/Matt-Hyland-734x460.png" alt="Matt Hyland, Chief Executive of the Victorian Jockeys Association" width="734" height="460" loading="lazy" />\n          <h3>Matt Hyland</h3>'
    );
  }
  if (html.indexOf('Troy Corstens, Head Trainer') === -1) {
    html = html.replace(
      '<h3>Will Larkin</h3>',
      '<h3>Will Larkin</h3>'
    );
    html = html.replace(
      'Troy couldn\u2019t make it; Will came up to speak.</p>\n        </article>',
      'Troy couldn\u2019t make it; Will came up to speak.</p>\n        </article>\n        <article>\n          <img src="https://cdn.prism.horse/media/9b20dc84e10a4f8baca387c8f4478e85.png" alt="Troy Corstens, Head Trainer at Malua Racing" width="754" height="1024" loading="lazy" />\n          <h3>Troy Corstens</h3>\n          <p>Head trainer at <a href="https://www.maluaracing.com.au/our-people">Malua Racing</a>. Couldn\u2019t make the room \u2014 Will came up to speak \u2014 and Harry rode Bohemian Boy for the team in race 2.</p>\n        </article>'
    );
  }
  document.open();
  document.write(html);
  document.close();
})().catch(function (err) {
  document.body.textContent = 'Could not load the recap.';
});
</script>
</body>
</html>
