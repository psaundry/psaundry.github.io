<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Underwood Stakes Day · Might and Power Club</title>
  <meta name="theme-color" content="#1E3D2F" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<script>
(async function () {
  const src = 'https://raw.githubusercontent.com/psaundry/psaundry.github.io/86b374f0cd3b96b2c6fc6116d47164dbe2bd9c12/index.html';
  const res = await fetch(src);
  let html = await res.text();

  html = html.replace(
    '.people img {\n      width: 100%;\n      border-radius: var(--xl);',
    '.people img {\n      width: 100%;\n      max-width: 100%;\n      height: auto;\n      display: block;\n      aspect-ratio: 3 / 2;\n      object-fit: cover;\n      object-position: center 18%;\n      border-radius: var(--xl);'
  );
  html = html.replace(
    '.people {\n      margin-top: 2rem;\n      display: grid;\n      gap: 2.5rem;\n    }',
    '.people {\n      margin-top: 2rem;\n      display: grid;\n      gap: 2.5rem 1.5rem;\n      align-items: start;\n    }\n    .people article { min-width: 0; }\n    .people img.troy { object-position: center 12%; }\n    .people img.will { object-position: center 42%; }'
  );
  html = html.replace('.matt { margin-top: 2.5rem; max-width: 40rem; }', '.matt { display: none; }');

  const people = `<div class="people">
        <article>
          <img src="/day/harry.jpg?v=3" alt="Harry Coffey" width="900" height="600" loading="lazy" decoding="async" />
          <h3>Harry Coffey</h3>
          <p>Harry rode in race 2 on Bohemian Boy for Troy Corstens and Will Larkin. He didn’t get the chocolates — but it was a pleasure to have him in the room.</p>
        </article>
        <article>
          <img class="will" src="/day/will.jpg?v=3" alt="Will Larkin of Malua Racing" width="900" height="600" loading="lazy" decoding="async" />
          <h3>Will Larkin</h3>
          <p>Will was in the room representing <a href="https://www.maluaracing.com.au/our-people">Malua Racing</a>. Goes without saying the boys would love to hear from you if you are looking for a share of a horse — <a href="https://www.maluaracing.com.au/ownership">maluaracing.com.au/ownership</a>.</p>
        </article>
        <article>
          <img class="troy" src="https://cdn.prism.horse/media/9b20dc84e10a4f8baca387c8f4478e85.png" alt="Troy Corstens, Head Trainer at Malua Racing" width="900" height="600" loading="lazy" decoding="async" />
          <h3>Troy Corstens</h3>
          <p>Head trainer at <a href="https://www.maluaracing.com.au/our-people">Malua Racing</a>. Couldn’t make the room — Will came up to speak — and Harry rode Bohemian Boy for the team in race 2.</p>
        </article>
        <article>
          <img src="https://www.justhorseracing.com.au/wp-content/uploads/2019/07/Matt-Hyland-734x460.png" alt="Matt Hyland, Chief Executive of the Victorian Jockeys Association" width="900" height="600" loading="lazy" decoding="async" />
          <h3>Matt Hyland</h3>
          <p>Matt was with us representing the Victorian Jockeys Association — son of legend Pat Hyland. The sort of presence that makes a race day feel like a race day.</p>
        </article>
      </div>`;

  html = html.replace(/<div class="people">[\s\S]*?<article class="matt">[\s\S]*?<\/article>/, people);

  document.open();
  document.write(html);
  document.close();
})().catch(function () {
  document.body.textContent = 'Could not load the recap.';
});
</script>
</body>
</html>
